[project]
name = "work-tickets"
version = "0.1.0"
description = "A local-first personal ticket workflow"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.2",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
strict = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
 [tool.hatch.build.targets.wheel]
 packages = ["work_tickets"]
 artifacts = ["work_tickets/static"]

[tool.hatch.build.targets.sdist]
artifacts = ["work_tickets/static"]
